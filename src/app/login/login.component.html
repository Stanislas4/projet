<div class="login-wrapper">
  <div class="login-card">
    <h2>Connexion Sécurisée</h2>
    <p class="subtitle">Entrez votre code d'accès personnel</p>

    <input
      type="text"
      [(ngModel)]="code"
      placeholder="Ex: VBG-POLICE-1234"
      (keyup.enter)="seConnecter()"
      class="login-input"
      [disabled]="loading"
      autocomplete="off"
    />

    <button (click)="seConnecter()" class="btn-login" [disabled]="loading">
      <span *ngIf="!loading">Entrer</span>
      <span *ngIf="loading">Vérification...</span>
    </button>

    <p *ngIf="message" class="error-msg">{{ message }}</p>
  </div>
</div>

<style>
.login-wrapper {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f0f2f5;
    font-family: sans-serif;
  }
.login-card {
    background:white;
    padding:32px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.1);
    width:100%;
    max-width:400px;
    text-align:center;
  }
.subtitle { color:#666; margin-bottom:20px; }
.login-input {
    width:100%;
    padding:14px;
    margin:15px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    text-transform:uppercase;
    box-sizing: border-box;
  }
.login-input:focus { outline:none; border-color:#111; }
.btn-login {
    width:100%;
    padding:14px;
    background:#111;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition: 0.2s;
  }
.btn-login:hover { background:#333; }
.btn-login:disabled { background:#999; cursor:not-allowed; }
.error-msg {
    color:#d32f2f;
    margin-top:16px;
    font-weight:600;
    background:#ffebee;
    padding:10px;
    border-radius:8px;
  }
</style>
