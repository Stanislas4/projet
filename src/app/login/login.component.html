<div class="login-wrapper">
  <div class="login-card">
    <h2>Connexion Sécurisée</h2>
    <p class="subtitle">Connecte-toi avec tes identifiants</p>

    <input
      type="email"
      [(ngModel)]="email"
      placeholder="E-mail"
      class="login-input"
      [disabled]="loading"
      autocomplete="username"
    />
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Mot de passe"
      (keyup.enter)="seConnecter()"
      class="login-input"
      [disabled]="loading"
      autocomplete="current-password"
    />

    <button (click)="seConnecter()" class="btn-login" [disabled]="loading">
      <span *ngIf="!loading">Entrer</span>
      <span *ngIf="loading">Vérification...</span>
    </button>

    <p *ngIf="message" class="error-msg">{{ message }}</p>
  </div>
</div>
